{# Reusable image preview modal with JavaScript initialization #}
{# Pass modal_id variable (e.g. 'inventoryImagePreview' or 'expenseImagePreview') #}

<div class="modal image-preview-modal" id="{{ modal_id }}Modal" aria-hidden="true">
  <div class="modal-content image-preview-content">
    <button type="button" class="image-preview-close" id="{{ modal_id }}Close" aria-label="Close preview" style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 24px; cursor: pointer;">×</button>
    <h3 id="{{ modal_id }}Title">Image Preview</h3>
    <img id="{{ modal_id }}Target" src="" alt="Image preview">
  </div>
</div>

<script>
window.initImagePreview = function(modalId) {
  const modal = document.getElementById(modalId + 'Modal');
  const modalContent = modal.querySelector('.modal-content');
  const img = document.getElementById(modalId + 'Target');
  const closeBtn = document.getElementById(modalId + 'Close');

  if (!modal || !img) return;

  window[modalId + '_showPreview'] = function(src) {
    img.src = src;
    modal.style.display = 'flex';
    modal.setAttribute('aria-hidden', 'false');
  };

  closeBtn.addEventListener('click', function() {
    modal.style.display = 'none';
    modal.setAttribute('aria-hidden', 'true');
  });

  modal.addEventListener('click', function(e) {
    if (e.target === modal) {
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal.style.display === 'flex') {
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
    }
  });
};

initImagePreview('{{ modal_id }}');
</script>

<style>
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.7);
  z-index: 1000;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.modal.image-preview-modal {
  display: none;
}

.modal-content {
  position: relative;
  background: white;
  padding: 20px;
  border-radius: 8px;
  max-width: 90%;
  max-height: 90vh;
  overflow: auto;
}

.image-preview-content img {
  max-width: 100%;
  max-height: 80vh;
  display: block;
}

.image-preview-close {
  cursor: pointer;
}
</style>
