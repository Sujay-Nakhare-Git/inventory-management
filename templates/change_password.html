{% extends "base.html" %}
{% block title %}Change Password — Gulmohar by Ankita{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Change Password</h2>
</div>

<div class="card" style="max-width:420px;">
    <form method="POST" action="{{ url_for('change_password') }}">
        <div class="form-group">
            <label>Current Password</label>
            <input type="password" name="current_password" class="input" required autofocus>
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password" class="input" required minlength="8">
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" class="input" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update Password</button>
    </form>
</div>
{% endblock %}
